version: "3.9"
services:

  nginx:
    image: nginx:latest
    ports:
      - "5000:80"  # expose to host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_gateway


  api_gateway:
    build: .
    command: python api_gateway.py
    environment:
      USER_SERVICE_URL: http://user_service:5001
      POST_SERVICE_URL: http://post_service:5002
      LEADERBOARD_SERVICE_URL: http://leaderboard_service:5003
      CHAT_SERVICE_URL: http://chat_service:5004
      MAP_SERVICE_URL: http://map_service:5005
    expose:
      - "5000"
    depends_on:
      - user_service
      - post_service
      - leaderboard_service
      - chat_service
      - map_service
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend_service:
    build: .
    command: python services/frontend_service.py
    environment:
      API_GATEWAY_URL: http://nginx:80
    ports:
      - "5008:5008"
    depends_on:
      - nginx

  user_service:
    build: .
    command: python services/user_service.py
    ports:
      - "5001:5001"

  post_service:
    build: .
    command: python services/post_service.py
    ports:
      - "5002:5002"
    depends_on:
      user_service:
        condition: service_started
      kafka:
        condition: service_healthy

  leaderboard_service:
    build: .
    command: python services/leaderboard_service.py
    ports:
      - "5003:5003"
    depends_on:
      post_service:
        condition: service_started
      kafka:
        condition: service_healthy

  chat_service:
    build: .
    command: python services/chat_service.py
    # ports:
      # - "5004:5004"
    depends_on:
      - post_service

  map_service:
    build: .
    command: python services/map_service.py
    ports:
      - "5005:5005"
  
 
# Persist the instance/ DB folder (if used later)
volumes:
  instance_data:
    driver: local
