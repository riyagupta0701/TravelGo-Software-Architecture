{% extends "base.html" %}

{% block content %}
<h1>Share Your Experience</h1>
<form method="POST" action="{{ url_for('add_post') }}">
    <input type="text" name="title" placeholder="Attraction Title" required><br><br>
    <textarea name="description" placeholder="Describe your experience"></textarea><br><br>
    <button type="submit">Post</button>
</form>

<h2>Recent Posts</h2>
{% for post in posts %}
  <div>
    <h3>{{ post.title }}</h3>
    <p>{{ post.description }}</p>
  </div>
{% else %}
  <p>No posts yet.</p>
{% endfor %}
{% endblock %}
