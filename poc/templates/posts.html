<!DOCTYPE html>
<html>
<head><title>TravelGo - Posts</title></head>
<body>
    <h1>Travel Experiences</h1>
    <nav>
        <a href="/">Home</a> | 
        <a href="/posts">Posts</a> | 
        <a href="/leaderboard">Leaderboard</a> | 
        <a href="/chat">Chat Forum</a>
    </nav>

    <form method="POST">
        <p>User ID: <input type="number" name="user_id" min="1" required></p>
        <p>Attraction:
      <select name="attraction" required>
        {% for a in attractions %}
          <option value="{{ a.name }}">{{ a.name }}</option>
        {% endfor %}
      </select>
    </p>
        <p>Experience: <input type="text" name="content" required></p>
        <button type="submit">Post</button>
    </form>

    <h2>Recent Posts</h2>
    <ul>
        {% for p in posts %}
        <li><b>User {{ p.user_id }}</b> at <i>{{ p.attraction }}</i>: {{ p.content }}</li>
        {% endfor %}
    </ul>
</body>
</html>
