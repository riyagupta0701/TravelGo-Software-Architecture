{% extends "base.html" %}

{% block content %}
<h1>Welcome to TravelGo</h1>
<p>Explore the map below to discover attractions and experiences.</p>

<div id="map"></div>
{% endblock %}

{% block scripts %}
<script>
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
    }).addTo(map);

    L.marker([48.8566, 2.3522]).addTo(map).bindPopup("Paris - Eiffel Tower");
    L.marker([40.7128, -74.0060]).addTo(map).bindPopup("New York - Statue of Liberty");
    L.marker([35.6895, 139.6917]).addTo(map).bindPopup("Tokyo - Shibuya Crossing");
</script>
{% endblock %}
